name: Compatible Core Promote

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Immutable candidate release tag to promote
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: compatible-core-stable-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Revalidate and promote the compatible core
    runs-on: windows-latest
    timeout-minutes: 45
    environment: core-stable
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Download immutable candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force candidate | Out-Null
          gh release download '${{ inputs.candidate_tag }}' --dir candidate --pattern 'core-latest.json' --pattern 'CORE_SHA256SUMS.txt' --pattern 'sub2api-core_*.zip'
      - name: Match candidate to reviewed main and verify payload
        id: verify
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw candidate/core-latest.json | ConvertFrom-Json
          $expectedVersion = (Get-Content -Raw frontend/CORE_VERSION).Trim()
          $expectedCommit = (Get-Content -Raw frontend/UPSTREAM_SUB2API_COMMIT).Trim()
          $expectedExtension = (Get-Content -Raw frontend/CORE_EXTENSION_VERSION).Trim()
          $expectedAlgorithm = (Get-Content -Raw frontend/ALGORITHM_VERSION).Trim()
          $requiredCapabilities = @((Get-Content -Raw frontend/CORE_CAPABILITIES).Trim() -split '\s+' | Where-Object { $_ })
          if ($manifest.channel -ne 'candidate') { throw 'Only a candidate manifest can be promoted' }
          foreach ($capability in $requiredCapabilities) {
            if ($manifest.capabilities -notcontains $capability) { throw "Candidate is missing required capability $capability" }
          }
          if ($manifest.version -ne $expectedVersion) { throw "Candidate $($manifest.version) is not reviewed main $expectedVersion" }
          if ($manifest.upstream_commit -ne $expectedCommit) { throw 'Candidate upstream commit does not match reviewed main' }
          if ($manifest.extension_version -ne $expectedExtension) { throw 'Candidate extension version does not match reviewed main' }
          if ($manifest.algorithm_version -ne $expectedAlgorithm) { throw 'Candidate algorithm version does not match reviewed main' }
          $archive = Get-Item candidate/sub2api-core_*.zip
          $artifact = $manifest.platforms.'windows-x86_64'
          if ($archive.Name -ne $artifact.archive_name) { throw 'Candidate archive name mismatch' }
          $sha = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          if ($sha -ne $artifact.sha256) { throw 'Candidate archive checksum mismatch' }
          $manifestSha = (Get-FileHash -Algorithm SHA256 candidate/core-latest.json).Hash.ToLowerInvariant()
          $checksumLines = @(Get-Content candidate/CORE_SHA256SUMS.txt)
          if ($checksumLines -notcontains "$sha  $($archive.Name)") { throw 'Candidate checksum list does not authenticate the archive' }
          if ($checksumLines -notcontains "$manifestSha  core-latest.json") { throw 'Candidate checksum list does not authenticate the manifest' }
          Expand-Archive -Force $archive.FullName candidate/unpacked
          $identity = & candidate/unpacked/sub2api.exe --version 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'Candidate core --version failed' }
          $capabilityMarker = @($manifest.capabilities) -join '|'
          foreach ($marker in @("Sub2API $($manifest.version) ", "commit: $($manifest.upstream_commit)", "extension: $($manifest.extension_version)", "capabilities: $capabilityMarker")) {
            if (-not $identity.Contains($marker)) { throw "Candidate identity missing $marker" }
          }
          "archive=$($archive.Name)" >> $env:GITHUB_OUTPUT
      - name: Promote the exact verified bytes to core-stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifestPath = 'candidate/core-latest.json'
          $manifest = Get-Content -Raw $manifestPath | ConvertFrom-Json
          $manifest.channel = 'stable'
          $manifest.release_url = 'https://github.com/${{ github.repository }}/releases/tag/core-stable'
          $manifest.platforms.'windows-x86_64'.url = 'https://github.com/${{ github.repository }}/releases/download/core-stable/${{ steps.verify.outputs.archive }}'
          $manifest | Add-Member -NotePropertyName promoted_from -NotePropertyValue '${{ inputs.candidate_tag }}' -Force
          $manifest | Add-Member -NotePropertyName promoted_at -NotePropertyValue ([DateTime]::UtcNow.ToString('o')) -Force
          $utf8NoBom = [Text.UTF8Encoding]::new($false)
          [IO.File]::WriteAllText($manifestPath, ($manifest | ConvertTo-Json -Depth 10) + "`n", $utf8NoBom)
          $archiveHash = (Get-FileHash -Algorithm SHA256 "candidate/${{ steps.verify.outputs.archive }}").Hash.ToLowerInvariant()
          $manifestHash = (Get-FileHash -Algorithm SHA256 $manifestPath).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText('candidate/CORE_SHA256SUMS.txt', "$archiveHash  ${{ steps.verify.outputs.archive }}`n$manifestHash  core-latest.json`n", $utf8NoBom)
          gh release view core-stable 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create core-stable --title 'Sub2API compatible core stable channel' --notes 'Manually promoted, compatibility-tested core releases.' --prerelease
          }
          gh release upload core-stable `
            "candidate/${{ steps.verify.outputs.archive }}" candidate/CORE_SHA256SUMS.txt $manifestPath --clobber
