name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build signed Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm@9 install --frozen-lockfile

      - name: Build embedded backend UI
        working-directory: frontend
        run: corepack pnpm@9 build

      - name: Build managed Sub2API core
        working-directory: frontend
        run: node scripts/prepare-desktop-sidecar.mjs

      - name: Prepare signed core update assets
        id: core-assets
        shell: pwsh
        working-directory: frontend
        env:
          SUB2API_CORE_RELEASE_NOTES: Bundled core published with desktop release.
        run: |
          node scripts/prepare-core-release.mjs
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = [string]$config.version
          $coreVersion = (Get-Content -Raw CORE_VERSION).Trim()
          $algorithmVersion = (Get-Content -Raw ALGORITHM_VERSION).Trim()
          $tag = "v$version"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "core_version=$coreVersion" >> $env:GITHUB_OUTPUT
          "algorithm_version=$algorithmVersion" >> $env:GITHUB_OUTPUT
          "core_channel=core-channel" >> $env:GITHUB_OUTPUT

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: Sub2API Cost Console v__VERSION__
          releaseBody: |
            Windows 成本运维桌面工具。

            - 桌面版本：v${{ steps.core-assets.outputs.version }}
            - 内核版本：v${{ steps.core-assets.outputs.core_version }}
            - 成本算法：v${{ steps.core-assets.outputs.algorithm_version }}
            - 包含签名更新清单、独立内核签名与 SHA-256 校验文件。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles nsis

      - name: Generate release checksums
        working-directory: frontend
        run: node scripts/prepare-desktop-release.mjs

      - name: Upload installer checksums
        shell: pwsh
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.core-assets.outputs.tag }}" `
            (Resolve-Path release-assets/INSTALLER_SHA256SUMS.txt) --clobber

      - name: Publish independent core channel
        shell: pwsh
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $channel = "${{ steps.core-assets.outputs.core_channel }}"
          $title = "Sub2API managed core channel"
          $notes = "Current core: v${{ steps.core-assets.outputs.core_version }}; algorithm: v${{ steps.core-assets.outputs.algorithm_version }}."
          gh release view $channel --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $channel --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease --title $title --notes $notes
          } else {
            gh release edit $channel --repo "${{ github.repository }}" --prerelease --title $title --notes $notes
          }
          $payload = Get-ChildItem -File release-assets | Where-Object { $_.Name -notlike 'core-update.json*' -and $_.Name -ne 'INSTALLER_SHA256SUMS.txt' } | ForEach-Object { $_.FullName }
          if ($payload.Count -eq 0) { throw "No versioned core assets were generated" }
          gh release upload $channel --repo "${{ github.repository }}" $payload --clobber
          gh release upload $channel --repo "${{ github.repository }}" `
            (Resolve-Path release-assets/core-update.json) `
            (Resolve-Path release-assets/core-update.json.sig) --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: sub2api-cost-console-${{ steps.core-assets.outputs.version }}-windows
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*
            frontend/release-assets/*
