name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build signed Windows desktop release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache-dependency-path: backend/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: corepack pnpm@9 install --frozen-lockfile

      - name: Build embedded backend UI
        working-directory: frontend
        run: corepack pnpm@9 build

      - name: Build managed Sub2API core
        working-directory: frontend
        run: node scripts/prepare-desktop-sidecar.mjs

      - name: Collect release metadata
        id: release-meta
        shell: pwsh
        working-directory: frontend
        run: |
          $config = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $version = [string]$config.version
          $coreVersion = (Get-Content -Raw CORE_VERSION).Trim()
          $algorithmVersion = (Get-Content -Raw ALGORITHM_VERSION).Trim()
          $upstreamCommit = (Get-Content -Raw UPSTREAM_SUB2API_COMMIT).Trim()
          $tag = "v$version"
          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_name }}" -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match tauri.conf.json version $tag"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "core_version=$coreVersion" >> $env:GITHUB_OUTPUT
          "algorithm_version=$algorithmVersion" >> $env:GITHUB_OUTPUT
          "upstream_commit=$upstreamCommit" >> $env:GITHUB_OUTPUT

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: v__VERSION__
          releaseName: Sub2API Cost Console v__VERSION__
          releaseBody: |
            Windows 成本运维桌面工具。

            - 桌面版本：v${{ steps.release-meta.outputs.version }}
            - 上游内核基线：v${{ steps.release-meta.outputs.core_version }}（${{ steps.release-meta.outputs.upstream_commit }}）
            - 成本算法：v${{ steps.release-meta.outputs.algorithm_version }}
            - 包含 Tauri 签名更新清单、安装包签名与 SHA-256 校验文件。
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles nsis

      - name: Generate release checksums
        working-directory: frontend
        run: node scripts/prepare-desktop-release.mjs

      - name: Upload installer checksums
        shell: pwsh
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.release-meta.outputs.tag }}" `
            (Resolve-Path release-assets/INSTALLER_SHA256SUMS.txt) --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: sub2api-cost-console-${{ steps.release-meta.outputs.version }}-windows
          if-no-files-found: error
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*
            frontend/release-assets/*
