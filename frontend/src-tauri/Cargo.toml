[package]
name = "sub2api-cost-console"
version = "0.2.4"
description = "Sub2API desktop cost operations console"
authors = ["Sub2API"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
hex = "0.4"
minisign-verify = "0.2.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rand = "0.8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.10.1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
